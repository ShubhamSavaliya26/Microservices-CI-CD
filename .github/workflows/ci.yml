name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build & Test Product Service
        run: mvn test
        working-directory: product-service

      - name: Build & Test Order Service
        run: mvn test
        working-directory: order-service

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"

  docker-integration:
    name: Docker Build & Integration Test
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: docker-compose up -d --build

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be healthy..."
          while ! docker inspect --format "{{json .State.Health.Status }}" postgres | grep '"healthy"'; do
            sleep 5
          done

      - name: Wait for Unleash Server
        run: |
          echo "Waiting for Unleash to be healthy..."
          while ! docker inspect --format "{{json .State.Health.Status }}" unleash-server | grep '"healthy"'; do
            sleep 5
          done

      - name: Wait for Product Service
        run: |
          echo "Waiting for Product Service to be healthy..."
          while ! docker inspect --format "{{json .State.Health.Status }}" product-service | grep '"healthy"'; do
            sleep 5
          done

      - name: Wait for Order Service
        run: |
          echo "Waiting for Order Service to be healthy..."
          while ! docker inspect --format "{{json .State.Health.Status }}" order-service | grep '"healthy"'; do
            sleep 5
          done

      - name: Initialize Feature Flags
        run: |
          chmod +x scripts/init-flags.sh
          ./scripts/init-flags.sh

      - name: Create Product
        run: |
          curl -s -X POST http://localhost:8080/api/products \
          -H "Content-Type: application/json" \
          -d '{"name":"Phone","price":800,"quantity":10}' > product.json
          cat product.json
          echo "PRODUCT_ID=$(jq '.id' product.json)" >> $GITHUB_ENV

      - name: Test premium-pricing flag
        run: |
          RESPONSE=$(curl -s http://localhost:8080/api/products/premium)
          echo "Premium Response: $RESPONSE"
          # Premium price should be 90% of 800 = 720
          if ! echo "$RESPONSE" | grep -q "720"; then
            echo "Premium pricing failed!"
            exit 1
          fi

      - name: Test bulk-order-discount flag
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8082/api/orders \
          -H "Content-Type: application/json" \
          -d '{"productId":'${PRODUCT_ID}',"quantity":6}')
          echo "Order Response: $RESPONSE"
          # Regular total = 800 * 6 = 4800
          # Discount total = 4800 * 0.85 = 4080
          if ! echo "$RESPONSE" | grep -q "4080"; then
            echo "Bulk order discount failed!"
            exit 1
          fi

      - name: Test order-notifications flag logging
        run: |
          curl -s -X POST http://localhost:8082/api/orders \
          -H "Content-Type: application/json" \
          -d '{"productId":'${PRODUCT_ID}',"quantity":2}'
          
          echo "Checking order-service logs for notification..."
          if ! docker logs order-service 2>&1 | grep -q "Order confirmed"; then
            echo "Order notification log missing!"
            exit 1
          fi

      - name: Tear down stack
        if: always()
        run: docker-compose down -v

  feature-flag-validation:
    name: Feature Flag Validation
    runs-on: ubuntu-latest
    needs: docker-integration

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Unleash Stack
        run: docker-compose up -d postgres unleash-server

      - name: Wait for Unleash Server
        run: |
          echo "Waiting for Unleash to be healthy..."
          while ! docker inspect --format "{{json .State.Health.Status }}" unleash-server | grep '"healthy"'; do
            sleep 5
          done

      - name: Initialize Feature Flags
        run: |
          chmod +x scripts/init-flags.sh
          ./scripts/init-flags.sh

      - name: Verify Flags Exist
        run: |
          FLAGS=$(curl -s -H "Authorization: Bearer default-token" http://localhost:4242/api/admin/projects/default/features)
          
          for flag in "premium-pricing" "order-notifications" "bulk-order-discount"; do
            if ! echo "$FLAGS" | grep -q "\"name\":\"$flag\""; then
              echo "Flag $flag does not exist in Unleash!"
              exit 1
            fi
          done

      - name: Test Flag Toggle Behavior
        run: |
          # Turn off premium-pricing
          curl -s -X POST "http://localhost:4242/api/admin/projects/default/features/premium-pricing/environments/development/off" \
            -H "Authorization: Bearer default-token"
            
          # Verify it's off
          STATUS=$(curl -s -H "Authorization: Bearer default-token" http://localhost:4242/api/admin/projects/default/features/premium-pricing | jq -r '.environments[] | select(.name=="development") | .enabled')
          
          if [ "$STATUS" != "false" ]; then
            echo "Failed to toggle flag OFF"
            exit 1
          fi

      - name: Tear down stack
        if: always()
        run: docker-compose down -v

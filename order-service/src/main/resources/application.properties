spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:orderdb
spring.h2.console.enabled=true

product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081/api/products}

unleash.app-name=order-service
unleash.instance-id=${HOSTNAME:local}
unleash.environment=development
unleash.api-url=${UNLEASH_API_URL:http://localhost:4242/api}
unleash.api-token=${UNLEASH_API_TOKEN:*:*.default-token}
